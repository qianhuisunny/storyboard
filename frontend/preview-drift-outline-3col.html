  { id: "p-attention", name: "The science of attention in video learning", editRate: 0, sections: [] },

// Sort by edit rate descending
PROJECTS.sort((a, b) => b.editRate - a.editRate);

let selectedProjectId = null;

function renderProjectList(filter = "") {
  const list = document.getElementById("projectList");
  const lc = filter.toLowerCase();
  const filtered = PROJECTS.filter(p => p.name.toLowerCase().includes(lc));

  list.innerHTML = filtered.map(p => {
    const isSelected = p.id === selectedProjectId;
    const rateColor = p.editRate > 0.3
      ? 'text-[#3A6B47]'
      : p.editRate > 0
        ? 'text-[#946B2D]'
        : 'text-gray-400';
    return `
    <button
      onclick="selectProject('${p.id}')"
      class="w-full text-left px-3 py-2.5 text-xs border-b border-gray-100 transition-colors ${
        isSelected
          ? 'bg-white border-l-2 border-l-[#7C3AED] font-medium'
          : 'hover:bg-white border-l-2 border-l-transparent'
      }"
    >
      <div class="truncate leading-snug ${p.editRate > 0 ? 'text-foreground' : 'text-gray-400'}">${p.name}</div>
      ${p.editRate > 0
        ? `<span class="text-[10px] ${rateColor} font-medium">${Math.round(p.editRate * 100)}% edited</span>`
        : `<span class="text-[10px] text-gray-300">no edits</span>`
      }
    </button>`;
  }).join("");
}

function filterProjects() {
  renderProjectList(document.getElementById("filterInput").value);
}

function selectProject(id) {
  selectedProjectId = id;
  renderProjectList(document.getElementById("filterInput").value);

  const content = document.getElementById("content-panel");
  const project = PROJECTS.find(p => p.id === id);

  if (!project || project.sections.length === 0) {
    content.innerHTML = `
      <div class="py-16 text-center text-gray-400 text-sm">
        No outline data for this project.
      </div>`;
    return;
  }

  const rateColor = project.editRate > 0.3
    ? 'text-[#3A6B47] bg-[#E6F2EB]'
    : project.editRate > 0
      ? 'text-[#946B2D] bg-[#FFF8E7]'
      : 'text-gray-500 bg-gray-100';

  let html = `
    <div class="max-w-4xl px-8 py-6">
      <div class="flex items-start justify-between mb-6">
        <h2 class="text-sm font-semibold text-foreground leading-snug max-w-[70%]">${project.name}</h2>
        <span class="text-xs font-semibold px-2 py-0.5 rounded shrink-0 ${rateColor}">
          ${Math.round(project.editRate * 100)}% edited
        </span>
      </div>
  `;

  for (const section of project.sections) {
    html += `
      <div class="mb-6">
        <div class="text-[11px] font-semibold text-[#7C3AED] uppercase tracking-wide mb-2 pb-1 border-b border-[#F0EEFF]">
          ${section.label}
        </div>
        <div class="text-[12.5px] leading-[1.8]">
    `;
    for (const f of section.fields) {
      html += renderField(f);
    }
    html += `</div></div>`;
  }

  html += `</div>`;
  content.innerHTML = html;
}

function renderField(diff) {
  const label = `<span class="text-[10px] uppercase text-gray-400 mr-2">${diff.field}</span>`;

  if (diff.status === "unchanged") {
    return `<div class="py-1 text-gray-500">${label}${diff.humanValue}</div>`;
  }
  if (diff.status === "removed") {
    return `<div class="py-1">${label}<span class="text-[#A63228] line-through bg-[#FDDDD9] px-0.5 rounded-sm">${diff.aiValue}</span> <span class="text-[9px] text-[#A63228] italic">(removed)</span></div>`;
  }
  if (diff.status === "added") {
    return `<div class="py-1">${label}<span class="text-[#3A6B47] bg-[#D4EDDA] px-0.5 rounded-sm">${diff.humanValue}</span> <span class="text-[9px] text-[#3A6B47] italic">(added)</span></div>`;
  }
  // modified
  return `<div class="py-1">${label}<span class="text-[#A63228] line-through bg-[#FDDDD9] px-0.5 rounded-sm">${diff.aiValue}</span> <span class="text-[#3A6B47] bg-[#D4EDDA] px-0.5 rounded-sm">${diff.humanValue}</span></div>`;
}

// Init
renderProjectList();
selectProject(PROJECTS[0].id);

</body>
</html>
