function scoreRow(label, score, feedback) {
  let color;
  if (score >= 7.0) color = 'text-green-700 bg-green-50 border-green-200';
  else if (score >= 6.0) color = 'text-yellow-700 bg-yellow-50 border-yellow-200';
  else color = 'text-red-700 bg-red-50 border-red-200';

  const feedbackHtml = feedback
    ? `<span class="text-xs text-gray-500 max-w-[200px] truncate" title="${feedback}">${feedback}</span>`
    : '';

  return `<div class="flex items-center justify-between py-1">
    <span class="text-sm text-gray-500">${label}</span>
    <div class="flex items-center gap-2">
      <span class="inline-flex items-center rounded-md border px-2 py-0.5 text-sm font-medium tabular-nums ${color}">${score.toFixed(1)}</span>
      ${feedbackHtml}
    </div>
  </div>`;
}

// ── Interaction ──
let currentSelected = null;

function selectEvent(id) {
  // Remove old selection
  document.querySelectorAll('[id^="btn-"]').forEach(el => {
    el.classList.remove('border-gray-200', 'bg-gray-50/60', 'shadow-sm');
    el.classList.add('border-transparent');
  });
  // Highlight new
  const btn = document.getElementById('btn-' + id);
  if (btn) {
    btn.classList.remove('border-transparent');
    btn.classList.add('border-gray-200', 'bg-gray-50/60', 'shadow-sm');
  }
  // Update detail
  document.getElementById('detail-panel').innerHTML = details[id] || '<p class="text-sm text-gray-400">No detail available</p>';
  currentSelected = id;
}

function toggleChain(chainId) {
  const body = document.getElementById(chainId + '-body');
  const chevron = document.getElementById(chainId + '-chevron');
  if (body.style.display === 'none') {
    body.style.display = '';
    chevron.style.transform = '';
  } else {
    body.style.display = 'none';
    chevron.style.transform = 'rotate(-90deg)';
  }
}
